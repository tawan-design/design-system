name: Bug / mismatch
description: Something is broken, or code doesn't match Figma
labels: ["bug"]
body:
  - type: input
    id: component
    attributes:
      label: Component
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: Expected vs actual. Screenshots of Figma vs Storybook help a lot.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: "@tawan-design/ui version"
